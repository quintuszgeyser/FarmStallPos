[pytest]
testpaths = tests
python_files = test_*.py
markers =
    known_defect: pins TODAY'S actual (defective) behavior; test intentionally
        documents a bug being tracked in Rev 5 and is expected to start FAILING
        once the referenced remediation item ships — that failure is the signal
        to update the test's expectation in the same commit as the fix, not to
        re-skip it.
